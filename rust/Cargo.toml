[package]
name = "flappy"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib for the wasm artifact; rlib so `cargo test` can build a test harness.
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.126"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlImageElement",
    "CanvasRenderingContext2d",
    "KeyboardEvent",
    "MouseEvent",
    "TouchEvent",
    "Performance",
    "Storage",
    "CssStyleDeclaration",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
